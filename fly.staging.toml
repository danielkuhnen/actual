# Fly.io config for the Fiwell staging sync-server.
# Builds the sync-server from this fork (sync-server.Dockerfile) instead of
# pulling the official actualbudget/actual-server image.
#
# Deploy: fly deploy -c fly.staging.toml

app = 'fiwell-v2-staging'
primary_region = 'cdg'

[build]
  dockerfile = 'sync-server.Dockerfile'

[deploy]
  strategy = 'immediate'

[processes]
  app = 'node --max-old-space-size=400 build/app.js'

[env]
  PORT = '5006'
  TINI_SUBREAPER = '1'

[[mounts]]
  source = 'fiwell_v2_staging_data'
  destination = '/data'

[http_service]
  internal_port = 5006
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [http_service.concurrency]
    type = 'connections'
    hard_limit = 25
    soft_limit = 20

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '20s'
    method = 'GET'
    path = '/health'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
